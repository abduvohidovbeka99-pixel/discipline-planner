<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#14111b" />
    <meta name="color-scheme" content="dark" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Дисциплина" />
    <link rel="icon" href="/favicon-v2.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon-v2.png" />
    <title>Ежедневник — дисциплина</title>
    <style>html{background:#14111b}html[data-theme="light"]{background:#f4f1fa}</style>
    <script>
      // Apply the saved theme before the first paint (no dark→light flash).
      try {
        var s = (JSON.parse(localStorage.getItem('discipline-settings') || '{}').state) || {};
        var t = s.theme === 'light' || (s.theme === 'system' && matchMedia('(prefers-color-scheme: light)').matches) ? 'light' : 'dark';
        document.documentElement.dataset.theme = t;
        document.documentElement.dataset.bg = s.bgPhoto === false ? 'off' : 'on';
        if (t === 'light') document.querySelector('meta[name="theme-color"]').setAttribute('content', '#f4f1fa');
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
