.wrap{max-width:1200px;margin:0 auto}
h1{font-size:22px;margin:0 0 12px}
.top{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:14px}
.top .m{font-weight:600;font-size:18px;min-width:150px;text-align:center}
button{font:inherit;color:inherit;cursor:pointer}
.nav{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:6px 12px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px;margin-bottom:14px}
.card h2{font-size:15px;margin:0 0 10px;color:var(--mut);font-weight:600;text-transform:uppercase;letter-spacing:.04em}
.bar{height:8px;background:var(--line);border-radius:99px;overflow:hidden;flex:1}

.sum{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:10px 24px}
.sum div{display:flex;align-items:center;gap:10px}

.big{font-size:34px;font-weight:700;color:var(--acc)}
.scroll{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:13px}
th,td{border:1px solid var(--line);padding:0;text-align:center;height:34px}

td.d{width:32px;min-width:32px}

td.d.on button{background:var(--accsoft);color:var(--acc);font-weight:700}
.today{background:var(--today)!important}
td.st{padding:0 8px;min-width:48px}
td.p{min-width:110px;padding:0 8px}
td.p div{display:flex;align-items:center;gap:6px}

input.g{width:44px;border:1px solid var(--line);background:var(--bg);color:inherit;border-radius:6px;padding:3px;text-align:center;font:inherit}
.del{border:0;background:transparent;color:var(--mut);padding:0 4px}
.del.arm{color:var(--warn);font-weight:700}
.add{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.add input{border:1px solid var(--line);background:var(--bg);color:inherit;border-radius:8px;padding:8px;font:inherit}
.add button{background:var(--acc);color:#fff;border:0;border-radius:8px;padding:8px 14px}
.wk{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.wk div{border:1px solid var(--line);border-radius:10px;padding:10px}
.wk small{color:var(--mut)}
.hint{color:var(--mut);font-size:12px;margin-top:8px}
body{background:radial-gradient(1100px 480px at 8% -10%,color-mix(in srgb,var(--acc) 22%,transparent),transparent),radial-gradient(900px 400px at 100% 0,color-mix(in srgb,#7c5cd6 16%,transparent),transparent),var(--bg)}
h1{font-size:30px;font-weight:800;letter-spacing:-.01em;background:linear-gradient(90deg,var(--acc),#e0a43a);-webkit-background-clip:text;background-clip:text;color:transparent}
.card{border-radius:16px;box-shadow:0 8px 24px -16px rgba(0,0,0,.4)}
.hero{display:flex;gap:18px;align-items:center;padding:18px 22px;border-radius:20px;margin-bottom:14px;color:#fff;background:linear-gradient(135deg,#1f8a5f,#2b6cb0 60%,#6b46c1);box-shadow:0 14px 34px -16px rgba(0,0,0,.5)}
.ht{font-size:21px;font-weight:700}.hs{opacity:.92;font-size:14px}
.tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}
.tab{border:1px solid var(--line);background:var(--card);border-radius:99px;padding:9px 18px;transition:.2s}
.tab:hover{transform:translateY(-1px)}
.tab.on{background:var(--acc);color:#fff;border-color:var(--acc)}
.ms{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:12px}
.mile{border:1px solid var(--line);border-radius:16px;padding:16px;background:var(--card);opacity:.55;transition:.3s}
.mile.on{opacity:1;border-color:var(--acc);box-shadow:0 0 0 3px var(--accsoft),0 14px 28px -16px var(--acc)}
.mile ul{margin:8px 0 0;padding-left:18px}.mile li{margin:5px 0}
.mile .pc{font-size:30px;font-weight:800;color:var(--acc)}
.mile.final{grid-column:1/-1;background:linear-gradient(135deg,#f6c453,#e0803a);color:#2a1a00;border-color:transparent}
.mile.final .pc{color:#2a1a00}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}
.qcard{cursor:pointer;border-radius:20px;padding:32px 26px;background:linear-gradient(135deg,var(--accsoft),var(--card));border:1px solid var(--line);user-select:none;transition:.2s}
.qcard:hover{transform:translateY(-2px)}
.qt{font-size:26px;line-height:1.35;font-weight:500}
.qa{margin-top:16px;color:var(--mut)}
.bks{display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:14px}
.bk{display:flex;gap:12px;align-items:flex-start;padding:10px 0;border-bottom:1px solid var(--line);cursor:pointer}
.cb{width:22px;height:22px;border:2px solid var(--acc);border-radius:6px;flex:none;display:flex;align-items:center;justify-content:center;color:#fff;margin-top:2px}
.bk.on .cb{background:var(--acc)}
.bk.on b{text-decoration:line-through;opacity:.6}
.bk small{color:var(--mut);display:block}
.fg{width:100%;max-height:260px}
.fg path{fill:none;stroke:var(--acc);stroke-width:7;stroke-linecap:round;stroke-linejoin:round}
.fg circle{fill:var(--acc)}
.fg .fl{stroke:var(--mut);stroke-width:3}
.fgw{background:linear-gradient(135deg,var(--accsoft),var(--card));border:1px solid var(--line);border-radius:16px;padding:10px}
.tg{display:grid;grid-template-columns:minmax(220px,340px) 1fr;gap:16px}
@media(max-width:640px){.tg{grid-template-columns:1fr}}
.wkr{display:flex;flex-wrap:wrap;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--line)}
.wkr .tx{flex:1;min-width:220px}
.sb{width:34px;height:34px;margin-right:4px;border-radius:50%;border:2px solid var(--acc);background:transparent}
.sb.on{background:var(--acc);color:#fff}
.sb.nx{box-shadow:0 0 0 3px var(--accsoft)}
.sm{padding:5px 12px!important;font-size:13px}
.ctl{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin:10px 0}
:root{--bd:#a9bccf;--bd2:#7b8fa3;--hl:#ff5d3a}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bd:#8ea4ba;--bd2:#586878;--hl:#ff7a5c}}
:root[data-theme="dark"]{--bd:#8ea4ba;--bd2:#586878;--hl:#ff7a5c}
.fg .b{fill:none;stroke:var(--bd);stroke-linecap:round;stroke-linejoin:round}
.fg .t{stroke-width:20}.fg .a{stroke-width:9}.fg .l{stroke-width:12}
.fg .f{stroke:var(--bd2)}
.fg circle.h{fill:var(--bd)}
.fg .g{fill:none;stroke:var(--hl);stroke-linecap:round;stroke-linejoin:round;opacity:.15}
.fg .eq{fill:none;stroke:var(--mut);stroke-width:5;stroke-linecap:round}
.fg .mat{fill:var(--line);stroke:none}
.fg .ph text{font-size:12px;font-weight:700;fill:var(--acc)}
.nav.on{background:var(--acc);color:#fff;border-color:var(--acc)}
.mc{display:inline-block;padding:3px 10px;border-radius:99px;background:var(--accsoft);font-size:12px;margin:0 6px 6px 0}
.mc.hot{background:color-mix(in srgb,var(--hl) 22%,transparent)}
.mc.hot::before{content:'● ';color:var(--hl)}
:root{--onacc:#fff}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--onacc:#052e1f}}

.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:15;background:var(--bg);padding:8px 0;margin-bottom:8px}

.seg button.on{background:var(--acc);color:var(--onacc);font-weight:700}
.wst{display:flex;align-items:stretch;gap:5px;margin-bottom:14px}

.wd{flex:1;min-width:0;display:flex;flex-direction:column;align-items:center;gap:3px;padding:8px 0 7px;border:1px solid var(--line);background:var(--card);border-radius:12px}

.wd u{display:block;height:100%;background:var(--acc)}

.wd.sel small{color:inherit;opacity:.85}
.wd.sel i{background:rgba(255,255,255,.35)}
.wd.sel u{background:var(--onacc)}
.wd.tdy:not(.sel){border:2px solid var(--acc)}
.wd.off{visibility:hidden}
.dayh{display:flex;justify-content:space-between;align-items:baseline;gap:10px;margin-bottom:6px}
.dayh b{font-size:18px}
.dayh span{color:var(--mut);font-size:13px}
.hr{display:flex;align-items:center;gap:14px;width:100%;text-align:left;padding:12px 14px;margin:0 0 8px;background:var(--card);border:1px solid var(--line);border-radius:16px;min-height:64px}
.hr.on{background:var(--accsoft);border-color:var(--acc)}

.hr.on .ck{background:var(--acc);border-color:var(--acc)}
.ck svg{width:22px;height:22px;opacity:0;transform:scale(.4);transition:.15s}
.hr.on .ck svg{opacity:1;transform:none}
.ck svg,.dc svg,.cd svg{fill:none;stroke:var(--onacc);stroke-width:3.5;stroke-linecap:round;stroke-linejoin:round}
.hr .nm{flex:1;font-weight:600;font-size:16px}
.sub{display:block;color:var(--mut);font-size:12px;font-weight:400}
.mrow{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;padding:6px 0}
.mb{width:44px;height:44px;margin-left:4px;border-radius:12px;border:1px solid var(--line);background:var(--card);font-size:22px}
.mb.on{background:var(--accsoft);border-color:var(--acc)}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:14px}
.stats div{background:var(--bg);border-radius:12px;padding:10px;text-align:center}
.stats b{display:block;font-size:22px;color:var(--acc)}
.stats small{color:var(--mut);font-size:11px}
.cal{display:grid;grid-template-columns:30px repeat(7,1fr) 42px;gap:6px 5px;align-items:center}
.cal7{display:grid;grid-template-columns:repeat(7,1fr) 38px;gap:6px 5px;align-items:center;margin-top:10px}
.sep{grid-column:1/-1;height:1px;background:var(--line);margin:2px 0}
.dh{font-size:11px;color:var(--mut);text-align:center}
.dh.we{color:var(--warn)}
.wl{font-size:11px;color:var(--mut)}
.wp{font-size:12px;text-align:right;color:var(--mut)}
.cd,.dc{aspect-ratio:1;width:100%;display:flex;align-items:center;justify-content:center;border-radius:50%;font-size:14px;border:2px solid transparent;padding:0}
.cd.hi{color:var(--onacc);font-weight:700}
.cd.tdy,.dc.tdy{border-color:var(--ink)}
.cd svg,.dc svg{width:62%;height:62%}
.dc{background:var(--bg);border-color:var(--line)}
.dc.on{background:var(--acc);border-color:var(--acc);color:var(--onacc)}
.dc.tdy{border-color:var(--ink)}
.dc.fut:not(.on){opacity:.5}
.hh{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:8px}
.hh b{font-size:17px}
.pcb{font-size:24px;font-weight:800;color:var(--acc)}
.hc .bar{margin-bottom:4px}
.hc .del{padding:8px 10px;border:1px solid var(--line);border-radius:10px}

.top{gap:6px}

}

chev2:g('<path d="M5 6l6 6-6 6M12 6l6 6-6 6"/>'),
chev3:g('<path d="M3 6l5 6-5 6M10 6l5 6-5 6M17 6l5 6-5 6"/>'),
timer:g('<circle cx="12" cy="13.5" r="7.5"/><path d="M12 9.5v4.5l3 2M9.5 3h5"/>')};
const EXK={pu:'pushup',abs:'crunch',pl:'pullup',dp:'dips',ch:'cp',bi:'bc',sh:'sp',tr:'tpd'};
const THC={};
const cut=(s,a,b)=>{const i=s.indexOf(a);if(i<0)return s;const j=s.indexOf(b,i);return s.slice(0,i)+s.slice(j+b.length)};
function thumb(k){if(THC[k])return THC[k];STATIC=true;let s;try{s=FX[k]?fx(k):fig(k)}finally{STATIC=false}
s=cut(cut(s,'<defs>','</defs>'),'<g class="ph">','</g>').split(' filter="url(#ds)"').join('').split(' filter="url(#gl)"').join('').replace('class="fg"','class="fg th"');return THC[k]=s}
function tl(b,i,sm){const d=b.dataset,a=d.a,on=b.classList.contains('on');let r;
if(a==='tv')r=GL[d.v];else if(a==='nv')r=GL[{food:'apple',plan:'plan',cr:'flask',w:'scale'}[d.v]];
else if(a==='fc')r=GL[{'Все':'all','Белок':'egg','Углеводы':'wheat','Фрукты и овощи':'apple','Орехи и жиры':'nut'}[d.c]];
else if(a==='qc')r=GL[{'Все':'star','Успешные люди':'crown','Политики':'flag','Философы':'column','Воины':'sword'}[d.c]];
else if(a==='ex')r=thumb(EXK[d.x]);
else if(a==='fg')r=thumb(EX.find(v=>v.id===TX).figs[+d.i][0]);
else if(a==='tk')r=GL.flame;
else if(a==='sp')r=GL[{'3.6':'chev1','2.4':'chev2','1.6':'chev3'}[d.p]];
else r=GL.timer;
const t=TL[i%TL.length],lab=b.textContent.trim();
b.className='apt'+(on?' on':'')+(sm?' sm':'');
b.innerHTML='<span class="ico" style="--t1:'+t[0]+';--t2:'+t[1]+'">'+r+'</span><span class="lb">'+lab+'</span>'}
function decorate(){const R=document.getElementById('app');
R.querySelectorAll('.seg,.chips').forEach(c=>{c.className='tiles';[...c.children].forEach((b,i)=>{if(b.dataset.a)tl(b,i)})});
R.querySelectorAll('.ctl button[data-a="sp"],.ctl button[data-a="rst"]').forEach((b,i)=>tl(b,i+3,1))}
function tabs(p){
if(V==='home')return '<div class="apph">'+ico(HOME,'s')+'<div><b>Главное</b><small class="sub">Ежедневник — дисциплина</small></div></div>'+hero(p)+'<div class="apps">'+AP2.map(a=>{const i=appInfo(a[0],p);return '<button class="app" data-a="tab" data-v="'+a[0]+'">'+ico(a,'',i[0])+'<b>'+a[1]+'</b><small>'+i[1]+'</small></button>'}).join('')+'</div>';
const a=AP2.find(x=>x[0]===V);
return '<div class="apph"><button class="back" data-a="tab" data-v="home">‹</button>'+ico(a,'s')+'<b>'+a[1]+'</b></div><nav class="dock">'+[HOME].concat(AP2).map(x=>'<button class="dk'+(V===x[0]?' on':'')+'" data-a="tab" data-v="'+x[0]+'">'+ico(x,'xs')+'<small>'+x[1]+'</small></button>').join('')+'</nav>'}
function render(){
  const n=new Date(Y,M+1,0).getDate(),d=mk(),isNow=Y===now.getFullYear()&&M===now.getMonth(),td=now.getDate();
  document.getElementById('mtitle').textContent=MN[M]+' '+Y;
  const cnt=h=>(d.c[h.id]||[]).filter(x=>x<=n).length;
  const pct=h=>h.goal>0?Math.min(100,Math.round(cnt(h)/h.goal*100)):0;
  const avgAll=S.habits.length?Math.round(S.habits.reduce((a,h)=>a+pct(h),0)/S.habits.length):0;
  let h='<div class="card"><h2>Привычки, %</h2><div style="display:flex;gap:20px;align-items:center;flex-wrap:wrap"><div><div class="big">'+avgAll+'%</div><small style="color:var(--mut)">общий прогресс</small></div><div class="sum" style="flex:1;min-width:260px">';
  S.habits.forEach(x=>{h+='<div><span class="n">'+esc(x.name)+'</span><span class="bar"><i style="width:'+pct(x)+'%"></i></span><b>'+pct(x)+'%</b></div>'});
  h+='</div></div></div>';
  const tc=(day)=>isNow&&day===td?' today':'';
  h+='<div class="card"><div class="scroll"><table><tr><th class="name">Привычка</th><th>Цель</th>';
  for(let i=1;i<=n;i++)h+='<th class="'+tc(i)+'">'+i+'<br><small>'+WD[new Date(Y,M,i).getDay()]+'</small></th>';
  h+='<th>Сделано</th><th>Осталось</th><th>Прогресс</th></tr>';
  S.habits.forEach(x=>{
    const set=d.c[x.id]||[],c=cnt(x);
    h+='<tr><td class="name"><button class="del'+(armed===x.id?' arm':'')+'" data-a="del" data-h="'+x.id+'" title="Удалить">'+(armed===x.id?'Удалить?':'×')+'</button> '+esc(x.name)+'</td><td><input class="g" type="number" min="0" max="31" value="'+x.goal+'" data-a="goal" data-h="'+x.id+'"></td>';
    for(let i=1;i<=n;i++){const on=set.includes(i);h+='<td class="d'+(on?' on':'')+tc(i)+'"><button data-a="t" data-h="'+x.id+'" data-d="'+i+'">'+(on?'✓':'')+'</button></td>'}
    h+='<td class="st">'+c+'</td><td class="st">'+Math.max(0,x.goal-c)+'</td><td class="p"><div><span class="bar"><i style="width:'+pct(x)+'%"></i></span><b>'+pct(x)+'%</b></div></td></tr>';
  });
  [['mood','Настроение дня'],['mot','Мотивация дня']].forEach(([k,t])=>{
    const vals=Object.values(d[k]).filter(v=>v>0),avg=vals.length?(vals.reduce((a,b)=>a+b,0)/vals.length).toFixed(1):'—';
    h+='<tr><td class="name">'+t+'</td><td></td>';
    for(let i=1;i<=n;i++){const v=d[k][i]||0;h+='<td class="d'+tc(i)+'"><button data-a="m" data-k="'+k+'" data-d="'+i+'">'+EM[v]+'</button></td>'}
    h+='<td class="st" colspan="3">среднее: <b>'+avg+'</b></td></tr>';
  });
  h+='</table></div>';
  h+='<div class="add"><input id="nn" placeholder="Новая привычка" maxlength="40"><input id="ng" type="number" min="1" max="31" placeholder="Цель (дней)" style="width:130px"><button data-a="add">Добавить</button></div></div>';
  h+='<div class="card"><h2>По неделям</h2><div class="wk">';
  for(let w=0,s=1;s<=n;w++,s+=7){
    const e=Math.min(n,s+6),days=e-s+1;let done=0;
    S.habits.forEach(x=>{done+=(d.c[x.id]||[]).filter(v=>v>=s&&v<=e).length});
    const tot=S.habits.length*days,p=tot?Math.round(done/tot*100):0;
    h+='<div><small>'+(w+1)+' неделя · '+s+'–'+e+'</small><div style="font-size:20px;font-weight:700">'+done+' <small>из '+tot+'</small></div><div class="bar"><i style="width:'+p+'%"></i></div><small>'+p+'% · осталось '+(tot-done)+'</small></div>';
  }
  h+='</div></div>';
  const sc=document.querySelector('.scroll'),sl=sc?sc.scrollLeft:0;
  document.body.dataset.v=V;document.getElementById('app').innerHTML=tabs(avgAll)+(V==='home'?'':V==='tracker'?mnav()+segc()+(TV==='tbl'?h:trk()):V==='rewards'?rewards(avgAll):V==='quotes'?quotes():V==='train'?train():V==='nut'?nut():books());decorate();
  const sc2=document.querySelector('.scroll');if(sc2)sc2.scrollLeft=sl;
}
document.addEventListener('click',e=>{
  const b=e.target.closest('[data-a]');if(!b)return;const a=b.dataset.a;
  if(a==='prev'){M--;if(M<0){M=11;Y--}}
  else if(a==='next'){M++;if(M>11){M=0;Y++}}
  else if(a==='now'){Y=now.getFullYear();M=now.getMonth()}
  else if(a==='t'){const d=mk(),s=d.c[b.dataset.h]||(d.c[b.dataset.h]=[]),i=+b.dataset.d,j=s.indexOf(i);j>=0?s.splice(j,1):s.push(i);save()}
  else if(a==='m'){const d=mk(),k=b.dataset.k,i=b.dataset.d;d[k][i]=((d[k][i]||0)+1)%6;save()}
  else if(a==='del'){if(armed===b.dataset.h){S.habits=S.habits.filter(x=>x.id!==armed);armed=null;save()}else{armed=b.dataset.h}}
  else if(a==='add'){const nm=document.getElementById('nn').value.trim(),g=+document.getElementById('ng').value||20;if(!nm)return;S.habits.push({id:'h'+Date.now(),name:nm,goal:Math.min(31,g)});save()}
  else if(a==='tab'){V=b.dataset.v;window.scrollTo(0,0)}
  else if(a==='ex'){TX=b.dataset.x;FI=0;RA=null}
  else if(a==='fg'){FI=+b.dataset.i}
  else if(a==='pp'){togglePlay();return}
  else if(a==='sp'){PD=+b.dataset.p}
  else if(a==='tv'){TV=b.dataset.v}
  else if(a==='nv'){NV=b.dataset.v;WA=null;CA=false}
  else if(a==='fc'){FC=b.dataset.c}
  else if(a==='tk'){S.nut.tk=+b.dataset.v;save()}
  else if(a==='cr'){const c=S.nut.cr,j=c.days.indexOf(b.dataset.d);if(j>=0)c.days.splice(j,1);else c.days.push(b.dataset.d);save()}
  else if(a==='crn'){if(CA){S.nut.cr.days=[];CA=false;save()}else CA=true}
  else if(a==='ws'){const v=parseFloat(String(document.getElementById('wv').value).replace(',','.')),dt=document.getElementById('wdt').value||iso(new Date());if(v>20&&v<400){WERR=false;const w=S.nut.w,j=w.findIndex(e=>e.d===dt);if(j>=0)w[j].v=v;else w.push({d:dt,v});w.sort((x,y)=>x.d<y.d?-1:1);save()}else WERR=true}
  else if(a==='wdel'){const dt=b.dataset.d;if(WA===dt){S.nut.w=S.nut.w.filter(e=>e.d!==dt);WA=null;save()}else WA=dt}
  else if(a==='sd'||a==='gd'){SD={k:Y+'-'+M,d:+b.dataset.d};if(a==='gd')TV='day'}
  else if(a==='sw'){const n=new Date(Y,M+1,0).getDate(),c=SD.k===Y+'-'+M?SD.d:(Y===now.getFullYear()&&M===now.getMonth()?now.getDate():1);SD={k:Y+'-'+M,d:Math.min(n,Math.max(1,c+7*(+b.dataset.s)))}}
  else if(a==='mv'){const dm=mk(),k=b.dataset.k,i=b.dataset.d,v=+b.dataset.v;dm[k][i]=dm[k][i]===v?0:v;save()}
  else if(a==='kk'){const x=b.dataset.x;S.tr.k[x]=Math.min(2,Math.max(.5,Math.round(((S.tr.k[x]||1)+ +b.dataset.s)*10)/10));save()}
  else if(a==='rst'){startRest(+b.dataset.s)}
  else if(a==='rs'){const x=b.dataset.x;if(RA===x){S.tr.d[x]=[];RA=null;save()}else RA=x}
  else if(a==='ss'){const x=b.dataset.x,k=b.dataset.k,d=S.tr.d[x]||(S.tr.d[x]=[]),j=d.indexOf(k);if(j>=0)d.splice(j,1);else{d.push(k);const hb=S.habits.find(v=>v.name===EX.find(q=>q.id===x).h);if(hb){const mk2=now.getFullYear()+'-'+now.getMonth(),m=S.data[mk2]||(S.data[mk2]={c:{},mood:{},mot:{}}),c=m.c[hb.id]||(m.c[hb.id]=[]);if(!c.includes(now.getDate()))c.push(now.getDate())}}save()}
  else if(a==='qc'){Q.c=b.dataset.c;Q.i=-1}
  else if(a==='qn'){Q.i++}
  else if(a==='bk'){S.books[b.dataset.id]=!S.books[b.dataset.id];save()}
  else return;
  if(a!=='del')armed=null;
  render();
});
document.addEventListener('change',e=>{
  if(e.target.dataset.a==='goal'){const x=S.habits.find(v=>v.id===e.target.dataset.h);if(x){x.goal=Math.max(0,+e.target.value||0);save();render()}}
});
render();
</script>
<script>
// Export button: saves the `habit-tracker-v1` data as a JSON file for the new app.
document.getElementById('exp').addEventListener('click',async()=>{const t=localStorage.getItem(KEY)||JSON.stringify(S),n='discipline-backup-'+iso(new Date())+'.json',f=new File([t],n,{type:'application/json'});
if(navigator.canShare&&navigator.canShare({files:[f]})&&matchMedia('(pointer:coarse)').matches){try{await navigator.share({files:[f]});return}catch(e){if(e.name==='AbortError')return}}
const a=document.createElement('a');a.href=URL.createObjectURL(f);a.download=n;document.body.appendChild(a);a.click();a.remove();
try{await navigator.clipboard.writeText(t)}catch(e){}});
</script>
